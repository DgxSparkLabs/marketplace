# MARKETPLACE.toml — single source of truth for marketplace identity
#
# Every generated manifest file (.claude-plugin/marketplace.json and the
# per-plugin .claude-plugin/plugin.json wrappers) inherits its owner,
# repository URL, version, license, and homepage from this file.
#
# `marketplace.name` below is the string after the `@` in every install
# command: `claude plugin install <plugin>@<marketplace.name>`. It is
# read by `_marketplace_name()` in scripts/utils.py and written into the
# top-level `.claude-plugin/marketplace.json` "name" field by Phase 5 of
# the generator. The stripped brand (name minus "-marketplace") prefixes
# every plugin's slash namespace — see docs/ARCHITECTURE.md "Names".
#
# Renaming the org or bumping the version is a single-line edit here
# followed by `uv run scripts/generate_manifest.py` (or just push — CI regenerates).

[marketplace]
name = "dgxsparklabs-template-marketplace"
display_name = "DgxSparkLabs Marketplace Template"
version = "1.0.0"
description = "The fork-ready template for agentic-capability marketplaces - the reference marketplace that ships the template itself."

[owner]
name = "DgxSparkLabs"
url = "https://github.com/DgxSparkLabs"

[repository]
url = "https://github.com/DgxSparkLabs/marketplace-template"
homepage = "https://github.com/DgxSparkLabs/marketplace-template"
license = "MIT"
