name: Compat — Skill (Claude)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Regenerate manifests from sources
        run: uv run scripts/generate_manifest.py

      - name: Derive marketplace identity (fork-safe)
        id: mp
        run: |
          echo "name=$(uv run python -c 'import tomllib;print(tomllib.load(open("src/.metadata-MARKETPLACE.toml","rb"))["marketplace"]["name"])')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-claude
        id: claude

      - name: Register marketplace
        run: claude plugin marketplace add ./

      - name: Install skill-example-single plugin
        run: claude plugin install skill-example-single@${{ steps.mp.outputs.name }} --scope project

      - name: Assert plugin is listed (grep match)
        # Match mode: grep substring — catalog row: claude plugin list shows installed entry
        run: claude plugin list | grep -F "skill-example-single@${{ steps.mp.outputs.name }}"

      - name: Cleanup
        if: always()
        run: |
          claude plugin uninstall skill-example-single --scope project || true
          claude plugin prune --scope project -y || true
          claude plugin marketplace remove ${{ steps.mp.outputs.name }} || true

